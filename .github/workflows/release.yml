name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: ver
        run: |
          REF="${GITHUB_REF_NAME}"
          if [[ "$REF" == v* ]]; then
            VERSION="${REF#v}"
          else
            VERSION="$(node -p "require('./el-geoushy/package.json').version")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: el-geoushy/pnpm-lock.yaml

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build frontend
        working-directory: el-geoushy
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Publish backend
        working-directory: backend
        run: |
          dotnet restore ElGeoushy.sln
          dotnet publish src/ElGeoushy.Api/ElGeoushy.Api.csproj -c Release -o artifacts/backend /p:Version=${{ steps.ver.outputs.version }}

      - name: Package artifacts
        run: |
          mkdir -p dist
          (cd el-geoushy && zip -r -q "../dist/frontend-${{ steps.ver.outputs.version }}.zip" .output)
          (cd backend/artifacts && zip -r -q "../../dist/backend-${{ steps.ver.outputs.version }}.zip" backend)
          ls -lh dist/

      - name: Extract CHANGELOG section
        id: notes
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          python3 << 'PY'
          import pathlib, os, re, sys
          version = os.environ.get("VERSION") or "${{ steps.ver.outputs.version }}"
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          # Match ## [x.y.z] - date ... until next ## [
          pattern = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
          m = re.search(pattern, text, re.S)
          body = m.group(1).strip() if m else ""
          out = pathlib.Path("dist/release-notes.md")
          if body:
              out.write_text(f"## What's changed in v{version}\n\n{body}\n", encoding="utf-8")
              print("Extracted CHANGELOG section for", version)
          else:
              out.write_text("", encoding="utf-8")
              print("No CHANGELOG section for", version, file=sys.stderr)
          PY
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.ver.outputs.version }}
          path: dist/*
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.ver.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body_path: dist/release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/frontend-${{ steps.ver.outputs.version }}.zip
            dist/backend-${{ steps.ver.outputs.version }}.zip
